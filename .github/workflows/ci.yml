name: security-ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm audit --audit-level=high
      - name: Ensure source does not contain committed secrets
        run: |
          if git grep -nE '(AUTH_PEPPER|PRELOGIN_SECRET|MFA_ENCRYPTION_KEY|POSTGRES_PASSWORD|S3_SECRET_KEY)=[^$<{]' -- ':!*.example' ':!docs/*'; then
            echo 'Potential committed secret found'
            exit 1
          fi

  sast-and-secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: gitleaks/gitleaks-action@v2
        continue-on-error: true
      - uses: github/codeql-action/init@v3
        with:
          languages: javascript-typescript
          build-mode: none
      - uses: github/codeql-action/analyze@v3

  container-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/docker/api.Dockerfile
          load: true
          tags: keywall-api:ci
      - name: Build worker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/docker/worker.Dockerfile
          load: true
          tags: keywall-worker:ci
      - name: Scan API image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: image
          image-ref: keywall-api:ci
          severity: CRITICAL,HIGH
          exit-code: '0'
          ignore-unfixed: true
          trivyignores: .trivyignore
      - name: Scan worker image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: image
          image-ref: keywall-worker:ci
          severity: CRITICAL,HIGH
          exit-code: '0'
          ignore-unfixed: true
          trivyignores: .trivyignore

  compose-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run secrets:setup
      - name: Start postgres service for migrations
        run: docker compose -f infra/docker-compose.yml up -d --wait postgres
      - name: Run DB migrations
        run: docker compose -f infra/docker-compose.yml run --rm migrate
      - name: Build and start remaining services
        run: docker compose -f infra/docker-compose.yml up -d --build
        env:
          DOCKER_BUILDKIT: 1
          COMPOSE_DOCKER_CLI_BUILD: 1
      - name: Wait for API health
        run: |
          for i in $(seq 1 40); do
            if curl -sf http://localhost:8080/health/ready > /dev/null 2>&1; then
              echo "API is ready"
              exit 0
            fi
            echo "Waiting for API... ($i/40)"
            sleep 3
          done
          echo "Timed out waiting for API"
          docker compose -f infra/docker-compose.yml logs --no-color
          exit 1
      - run: npm run test:compose
      - run: npm run backup:compose -- ci-backup
      - run: npm run restore:drill -- ci-backup
      - run: CV_FORBIDDEN_MARKER=CI-SMOKE-PLAINTEXT-NEVER-SENT npm run verify:plaintext-negative
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
        env:
          CV_ORIGIN: http://localhost:8080
          CV_SKIP_WEB_SERVER: '1'
      - if: failure()
        run: docker compose -f infra/docker-compose.yml logs --no-color
      - if: always()
        run: docker compose -f infra/docker-compose.yml down -v
      - name: Generate API SBOM
        if: success()
        uses: anchore/sbom-action@v0.17.9
        with:
          image: keywall-api:ci
          artifact-name: keywall-api.spdx.json
          format: spdx-json

  compose-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run secrets:setup
      - name: Start postgres service for migrations
        run: docker compose -f infra/docker-compose.yml up -d --wait postgres
      - name: Run DB migrations
        run: docker compose -f infra/docker-compose.yml run --rm migrate
      - name: Build and start remaining services
        run: docker compose -f infra/docker-compose.yml up -d --build
        env:
          DOCKER_BUILDKIT: 1
          COMPOSE_DOCKER_CLI_BUILD: 1
      - name: Wait for service readiness
        run: |
          for i in $(seq 1 40); do
            if curl -sf http://localhost:8080 > /dev/null 2>&1; then
              echo "Service is ready"
              exit 0
            fi
            echo "Waiting... ($i/40)"
            sleep 3
          done
          echo "Timed out waiting for service"
          docker compose -f infra/docker-compose.yml logs --no-color
          exit 1
      - run: npm run test:compose
      - name: ZAP baseline
        uses: zaproxy/action-baseline@v0.14.0
        with:
          target: http://localhost:8080
          rules_file_name: .zap/rules.tsv
          allow_issue_writing: false
          fail_action: true
      - name: Compose logs on failure
        if: failure()
        run: docker compose -f infra/docker-compose.yml logs --no-color
      - if: always()
        run: docker compose -f infra/docker-compose.yml down -v
