services:
  - type: web
    name: keywall-api
    plan: free
    runtime: node
    buildCommand: npm ci --include=dev && npm run build -w @keywall/api
    startCommand: npm run db:migrate -w @keywall/api && npm run start -w @keywall/api
    healthCheckPath: /health/ready
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production
      - key: HOST
        value: 0.0.0.0
      - key: PORT
        value: "10000"
      - key: COOKIE_SECURE
        value: "true"
      - key: ALLOW_UNVERIFIED_LOGIN
        value: "true"
      - key: EMAIL_DELIVERY
        value: disabled
      - key: ENABLE_ATTACHMENTS
        value: "false"
      - key: PUBLIC_ORIGIN
        sync: false
      - key: DATABASE_URL_FILE
        value: /etc/secrets/DATABASE_URL
      - key: AUTH_PEPPER_FILE
        value: /etc/secrets/AUTH_PEPPER
      - key: PRELOGIN_SECRET_FILE
        value: /etc/secrets/PRELOGIN_SECRET
      - key: MFA_ENCRYPTION_KEY_FILE
        value: /etc/secrets/MFA_ENCRYPTION_KEY
